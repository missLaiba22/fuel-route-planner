<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Fuel Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
      --border: #e2e5ea; --accent: #2563eb; --route: #2563eb; --stop: #ea580c;
      --error-bg: #fef2f2; --error: #b91c1c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text); background: var(--bg);
      display: grid; grid-template-columns: 380px 1fr; height: 100vh;
    }
    aside {
      background: var(--panel); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 20px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    form { display: grid; gap: 10px; margin-bottom: 18px; }
    label { font-weight: 600; font-size: 12px; color: var(--muted); }
    input {
      width: 100%; padding: 9px 10px; font: inherit;
      border: 1px solid var(--border); border-radius: 6px;
    }
    button {
      padding: 10px; font: inherit; font-weight: 600; color: #fff;
      background: var(--accent); border: 0; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .error {
      background: var(--error-bg); color: var(--error);
      padding: 10px; border-radius: 6px; margin-bottom: 14px;
    }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat { border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .stat b { display: block; font-size: 18px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .stat.total { grid-column: span 2; background: #eff6ff; border-color: #bfdbfe; }
    ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    li { border: 1px solid var(--border); border-radius: 8px; padding: 10px; cursor: pointer; }
    li:hover { border-color: var(--stop); }
    .row { display: flex; justify-content: space-between; gap: 8px; }
    .muted { color: var(--muted); font-size: 12px; }
    .badge {
      display: inline-grid; place-items: center; width: 22px; height: 22px;
      border-radius: 50%; background: var(--stop); color: #fff;
      font-size: 12px; font-weight: 700; margin-right: 6px;
    }
    .meta { color: var(--muted); font-size: 12px; margin-top: 14px; }
    #map { height: 100%; }
    .pin {
      display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
      color: #fff; font-weight: 700; font-size: 12px; border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
    }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); padding: 16px; }
      #map { height: 60vh; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Fuel Route Planner</h1>
    <p class="sub">500-mile range · 10 MPG · starts with a full tank</p>

    <form id="trip">
      <div><label for="start">Start</label><input id="start" name="start" placeholder="New York, NY" required></div>
      <div><label for="finish">Finish</label><input id="finish" name="finish" placeholder="Los Angeles, CA" required></div>
      <button id="go" type="submit">Plan route</button>
    </form>

    <div id="error" class="error" hidden></div>
    <div id="results" hidden>
      <div class="stats">
        <div class="stat total"><span>Total fuel cost</span><b id="cost"></b></div>
        <div class="stat"><span>Distance</span><b id="distance"></b></div>
        <div class="stat"><span>Fuel stops</span><b id="nstops"></b></div>
        <div class="stat"><span>Fuel bought</span><b id="gallons"></b></div>
        <div class="stat"><span>Drive time</span><b id="duration"></b></div>
      </div>
      <ol id="stops"></ol>
      <p class="meta" id="meta"></p>
    </div>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "{% url 'route-plan' %}";
    const map = L.map('map').setView([39.5, -98.35], 4);
    // OSM tiles require a Referer; Django's default policy would strip it.
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, referrerPolicy: 'strict-origin-when-cross-origin',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    const $ = id => document.getElementById(id);
    const money = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

    function pin(text, color) {
      return L.divIcon({className: '', iconSize: [26, 26], iconAnchor: [13, 13],
        html: `<div class="pin" style="background:${color}">${text}</div>`});
    }

    // textContent avoids HTML injection.
    function popup(lines) {
      const div = document.createElement('div');
      lines.forEach((line, i) => {
        const el = document.createElement(i === 0 ? 'b' : 'div');
        el.textContent = line;
        div.appendChild(el);
      });
      return div;
    }

    function render(data) {
      layer.clearLayers();
      const line = data.geojson.features.find(f => f.properties.kind === 'route');
      const latlngs = line.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
      const routeLine = L.polyline(latlngs, {color: getComputedStyle(document.documentElement)
        .getPropertyValue('--route').trim(), weight: 5, opacity: .8}).addTo(layer);

      L.marker([data.start.latitude, data.start.longitude], {icon: pin('A', '#16a34a')})
        .bindPopup(popup(['Start', data.start.label])).addTo(layer);
      L.marker([data.finish.latitude, data.finish.longitude], {icon: pin('B', '#dc2626')})
        .bindPopup(popup(['Finish', data.finish.label])).addTo(layer);

      const list = $('stops');
      list.replaceChildren();
      data.fuel_stops.forEach(s => {
        const marker = L.marker([s.latitude, s.longitude], {icon: pin(s.stop_number, '#ea580c')})
          .bindPopup(popup([`Stop ${s.stop_number}: ${s.name}`, `${s.city}, ${s.state}`,
            `Mile ${s.mile_marker}`, `$${s.price_per_gallon.toFixed(3)}/gal`,
            `${s.gallons.toFixed(1)} gal = ${money(s.cost)}`]))
          .addTo(layer);

        const li = document.createElement('li');
        const top = document.createElement('div'); top.className = 'row';
        const name = document.createElement('div');
        const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = s.stop_number;
        const nameText = document.createElement('b'); nameText.textContent = s.name;
        name.append(badge, nameText);
        const cost = document.createElement('b'); cost.textContent = money(s.cost);
        top.append(name, cost);
        const detail = document.createElement('div'); detail.className = 'muted';
        detail.textContent = `${s.city}, ${s.state} · mile ${s.mile_marker} · ` +
          `$${s.price_per_gallon.toFixed(3)}/gal · ${s.gallons.toFixed(1)} gal`;
        li.append(top, detail);
        li.onclick = () => { map.setView([s.latitude, s.longitude], 10); marker.openPopup(); };
        list.appendChild(li);
      });
      if (!data.fuel_stops.length) {
        const li = document.createElement('li');
        li.className = 'muted';
        li.textContent = 'No fuel stops needed: the trip fits in one tank.';
        list.appendChild(li);
      }

      $('cost').textContent = money(data.total_fuel_cost);
      $('distance').textContent = `${data.distance_miles.toLocaleString()} mi`;
      $('nstops').textContent = data.fuel_stops.length;
      $('gallons').textContent = `${data.total_gallons.toFixed(1)} gal`;
      $('duration').textContent = `${data.duration_hours} h`;
      $('meta').textContent = `${data.meta.stations_considered} stations near the route · ` +
        `${data.meta.routing_api_calls} routing API call(s) · computed in ${data.meta.compute_time_ms} ms`;
      $('results').hidden = false;
      map.fitBounds(routeLine.getBounds(), {padding: [30, 30]});
    }

    async function plan(start, finish) {
      $('go').disabled = true; $('go').textContent = 'Planning…';
      $('error').hidden = true;
      try {
        const params = new URLSearchParams({start, finish});
        const res = await fetch(`${API_URL}?${params}`);
        const data = await res.json();
        if (!res.ok) {
          const msg = data.error || Object.entries(data).map(([k, v]) => `${k}: ${v}`).join(' ');
          throw new Error(msg);
        }
        render(data);
        history.replaceState(null, '', `?${params}`);
      } catch (err) {
        $('error').textContent = err.message || 'Something went wrong.';
        $('error').hidden = false;
      } finally {
        $('go').disabled = false; $('go').textContent = 'Plan route';
      }
    }

    $('trip').addEventListener('submit', e => {
      e.preventDefault();
      plan($('start').value, $('finish').value);
    });

    // Load trip from URL.
    const qs = new URLSearchParams(location.search);
    if (qs.get('start') && qs.get('finish')) {
      $('start').value = qs.get('start');
      $('finish').value = qs.get('finish');
      plan(qs.get('start'), qs.get('finish'));
    }
  </script>
</body>
</html>
